<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RoleTool · 职业可视化开发工具</title>
  <link rel="stylesheet" href="vendor/litegraph.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header id="toolbar">
    <div class="brand">RoleTool</div>
    <nav class="tabs">
      <button id="tab-logic" class="tab-btn active" onclick="switchTab('logic')">逻辑蓝图</button>
      <button id="tab-meta" class="tab-btn" onclick="switchTab('meta')">职业配置</button>
      <button id="tab-source" class="tab-btn" onclick="switchTab('source')">源码预览</button>
      <button id="tab-docs" class="tab-btn" onclick="switchTab('docs')">文档</button>
      <button id="tab-about" class="tab-btn" onclick="switchTab('about')">关于</button>
    </nav>
    <div class="toolbar-actions">
      <button id="btn-write" class="tool-btn" onclick="if(typeof onWriteToPlugin==='function')onWriteToPlugin()">写入主插件源码树</button>
      <button id="btn-build" class="tool-btn" onclick="if(typeof onBuildPlugin==='function')onBuildPlugin()">一键编译</button>
      <button id="btn-export" class="tool-btn" onclick="if(typeof exportBlueprint==='function')exportBlueprint()">导出蓝图</button>
      <button id="btn-import" class="tool-btn" onclick="document.getElementById('importFile').click()">导入蓝图</button>
      <input type="file" id="importFile" accept=".rtp,application/json" style="display:none"
             onchange="if(typeof importBlueprint==='function')importBlueprint(this)">
    </div>
  </header>

  <main id="content">
    <!-- 逻辑蓝图 -->
    <section id="view-logic" class="view-section active">
      <aside id="node-panel">
        <input id="node-search" type="text" placeholder="搜索节点…" oninput="filterNodes(this.value)">
        <div id="node-list"></div>
      </aside>
      <div id="graph-host">
        <div id="graphDiv"></div>
        <div id="validation-panel">
          <div class="vp-title">校验</div>
          <ul id="validation-list"></ul>
        </div>
      </div>
    </section>

    <!-- 职业配置 -->
    <section id="view-meta" class="view-section">
      <div id="meta-form"></div>
      <div id="config-entries"></div>
      <button id="add-config" class="tool-btn" onclick="if(typeof onAddConfig==='function')onAddConfig()">添加配置项</button>
    </section>

    <!-- 源码预览 -->
    <section id="view-source" class="view-section">
      <nav class="src-tabs">
        <button id="srctab-cs" class="src-tab active" onclick="switchSrcTab('cs')">C#</button>
        <button id="srctab-lang" class="src-tab" onclick="switchSrcTab('lang')">翻译</button>
        <button id="srctab-doc" class="src-tab" onclick="switchSrcTab('doc')">文档</button>
      </nav>
      <div id="pane-cs" class="src-editor-pane active"><div id="editor-cs" class="ace-editor"></div></div>
      <div id="pane-lang" class="src-editor-pane"><div id="editor-lang" class="ace-editor"></div></div>
      <div id="pane-doc" class="src-editor-pane"><div id="editor-doc" class="ace-editor"></div></div>
    </section>

    <!-- 文档 -->
    <section id="view-docs" class="view-section">
      <div id="docs-toolbar">
        <input id="docs-search" type="text" placeholder="搜索节点 / 关键词…" oninput="filterDocs(this.value)">
      </div>
      <div id="docs-body"></div>
    </section>

    <!-- 关于 -->
    <section id="view-about" class="view-section">
      <div class="about-box">
        <h1>RoleTool · 职业可视化开发工具</h1>
        <p>RoleTool 是《Light In The Dark》（暗黑之中）模组的职业开发辅助工具。
           它通过可视化节点蓝图编辑职业逻辑，并据此自动生成对应的 C# 职业源码、
           本地化翻译与说明文档，最终可直接写入主插件的源码树。</p>
        <p>工作流：在「逻辑蓝图」中拖拽节点搭建职业行为 → 在「职业配置」中填写职业元数据
           → 在「源码预览」中检查生成的 C# / 翻译 / 文档 → 点击「写入主插件源码树」完成落盘。</p>
        <p class="about-version" id="about-version"></p>
        <div id="changelog" class="changelog"></div>
      </div>
    </section>
  </main>

  <div id="status" class="hidden"></div>

  <div id="customModal" class="modal-overlay hidden">
    <div class="modal-box">
      <div class="modal-title"></div>
      <div id="modalMessage" class="modal-message"></div>
      <div class="modal-actions">
        <button class="tool-btn" onclick="closeModal()">关闭</button>
      </div>
    </div>
  </div>

  <div id="build-modal" class="modal-overlay hidden">
    <div class="modal-box build-box">
      <div class="modal-title">构建输出</div>
      <pre id="build-output"></pre>
      <div class="modal-actions">
        <button class="tool-btn" onclick="closeBuildModal()">关闭</button>
      </div>
    </div>
  </div>

  <script src="vendor/litegraph.js"></script>
  <script src="vendor/ace/ace.js"></script>
  <script src="vendor/ace/theme-monokai.js"></script>
  <script src="vendor/ace/mode-csharp.js"></script>
  <script src="vendor/ace/mode-json.js"></script>
  <script src="vendor/ace/mode-markdown.js"></script>
  <script src="vendor/ace/mode-yaml.js"></script>
  <script src="vendor/ace/mode-xml.js"></script>
  <script src="js/constants.js"></script>
  <script src="js/changelog.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/node-defs.js"></script>
  <script src="js/graph.js"></script>
  <script src="js/docs.js"></script>
  <!-- MORE MODULES -->
  <script src="js/bridge.js"></script>
  <script src="js/validation.js"></script>
  <script src="js/blueprint.js"></script>
  <script src="js/form.js"></script>
  <script src="js/emit-map.js"></script>
  <script src="js/preview.js"></script>
  <script src="js/codegen.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
